version: '3.8'

services:
  target:
    build:
      context: ./target
    container_name: target_nginx
    networks:
      quic_lab:
        ipv4_address: 10.13.37.10
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./target_logs:/var/log/nginx

  fuzzer:
    build:
      context: ./fuzzer
    container_name: fuzzer_node
    networks:
      quic_lab:
        ipv4_address: 10.13.37.20
    tty: true

  monitor:
    build:
      context: ./monitor
    container_name: monitor_node
    networks:
      quic_lab:
        ipv4_address: 10.13.37.30
    cap_add:
      - NET_ADMIN
      - NET_RAW
    tty: true

networks:
  quic_lab:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.13.37.0/24
